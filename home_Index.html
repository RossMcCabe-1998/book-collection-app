<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link rel="stylesheet" href="./css/home.css">
    <!-- Bootstrap + jQuery -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
        
    <!-- Bootstrap Offcanvas Component -->
    <link rel="stylesheet" href="css/bootstrap-off-canvas.css">
    <script src="js/bootstrap-off-canvas.js"></script>
    
    <!-- social media button icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
    <body>
        <div class="off-canvas-wrapper">
            <div id="off_canvas" class="off-canvas">
            <!-- Navbar -->
                <div class="off-canvas-nav bg-dark">
                <!-- You may use any of the bootstrap components here -->
                    <div class="nav nav-pills nav-fill flex-column">
                        <a href="home_Index.html" class="text-left nav-item nav-link active">Home</a>
                        <a href="gallery.html" class="text-left nav-item nav-link">Gallery</a>
                        <a href="description.html" class="text-left nav-item nav-link">Descriptions</a>
                        <a href="contact.html" class="text-left nav-item nav-link">Contact Us</a>
                    </div>
                </div>
                <!-- OPTION: Adding 'overlay' class here will add overlay mask on the content -->
                <div class="off-canvas-content overlay" data-target="#off_canvas">
                    <nav class="navbar navbar-dark bg-dark">
                        <button class="navbar-toggler off-canvas-toggler mx-2" type="button" data-target="#off_canvas" 
                                aria-controls="offcanvasSupportedContent" aria-expanded="false" aria-label="Toggle off canvas menu">
                        <span class="navbar-toggler-icon"></span>
                        </button>
                        <a class="navbar-brand ml-3 mr-auto" href="home_Index.html">
                            <img class="logo" src="images/icon.jpg">
                            Book Collection
                        </a>
                    </nav>
                    
                    <!-- Main Content Here -->
                    <div class="mainContent">
                        <h1>My Book Collection</h1>

                        <form id="bookForm">
                            <div id="searchSection">
                                <!-- Radio button to select search mode -->
                                <div id="inputSections">
                                    <h3>Add book by:</h3>
                                    <label><input type="radio" name="searchMode" value="title" checked>Title</label>
                                    <label><input type="radio" name="searchMode" value="isbn">ISBN</label><br>
                                <!-- Input fields -->
                                    <label><input type="text" id="bookTitle" placeholder="Enter book title" /></label>
                                    <label><input type="text" id="bookISBN" placeholder="Enter ISBN" /></label>
                                </div>
                                    
                                <button type="submit">Add Book</button>
                            </div>
                        </form>

                        <div id="status"></div>

                        <!-- Favourites filter -->
                        <label><input type="checkbox" id="filterFavourites"><span>☆ Favourites only</span></label>

                        <h2>Book List</h2>
                        <div id="bookContainer"></div>
                    </div>
                    
                    <div class="footer">
                        <div class="social">
                            <a href="https://www.instagram.com/" target="_blank" class="fa fa-instagram"></a>
                            <a href="https://www.reddit.com/" target="_blank" class="fa fa-reddit"></a>
                            <a href="https://x.com/" target="_blank" class="fa fa-twitter"></a>
                            <a href="https://www.youtube.com/" target="_blank" class="fa fa-youtube"></a>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
        <script src="./js/bookCollection.js"></script> 
    </body>
    
</html>
